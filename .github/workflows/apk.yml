name: Build APK

on:
  push:
    branches: [main, 'claude/**']
    paths: ['app/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci --legacy-peer-deps
      - run: npm test
      - run: npx ng build
      - run: npx cap sync android

      # Opcional: com o secret ANDROID_KEYSTORE_BASE64 (+ _PASSWORD e ANDROID_KEY_ALIAS) o APK
      # sai sempre com a mesma assinatura e pode ser instalado por cima da versão anterior.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Assemble APK
        working-directory: app/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: CrunchySync-apk
          path: app/android/app/build/outputs/apk/release/app-release.apk

      # Release fixa "apk-latest": abra a página no celular e baixe o APK.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest \
            "android/app/build/outputs/apk/release/app-release.apk#CrunchySync.apk" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "CrunchySync (APK mais recente)" \
            --notes "Build #${{ github.run_number }} do commit $GITHUB_SHA"
